<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - Ethiq Recruitment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');
        
        :root {
            --primary-bg: #0a0a0a;
            --secondary-bg: #1a1a1a;
            --card-bg: #262626;
            --accent: #e8ff47;
            --accent-hover: #d4f033;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --border: #404040;
            --border-hover: #525252;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 1000;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        header {
            padding: 2rem 0;
            border-bottom: 1px solid var(--border);
            position: relative;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            height: 40px;
            width: auto;
        }
        
        .hero {
            padding: 4rem 0 6rem;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, rgba(232, 255, 71, 0.03) 0%, transparent 50%);
        }
        
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 3rem;
            font-weight: 300;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 4rem;
            margin-bottom: 3rem;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            display: block;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .filters {
            padding: 3rem 0;
            border-bottom: 1px solid var(--border);
            background: var(--secondary-bg);
        }
        
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        
        .filter-group {
            position: relative;
        }
        
        .filter-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .filter-select {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(232, 255, 71, 0.1);
        }
        
        .jobs-section {
            padding: 4rem 0;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }
        
        .jobs-count {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .view-toggle {
            display: flex;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 4px;
        }
        
        .view-btn {
            padding: 0.5rem 1rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .view-btn.active {
            background: var(--accent);
            color: var(--primary-bg);
        }
        
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2rem;
        }
        
        .job-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transform: translateY(0);
        }
        
        .job-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(232, 255, 71, 0.05), transparent);
            transition: left 0.6s ease;
        }
        
        .job-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .job-card:hover::before {
            left: 100%;
        }
        
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }
        
        .job-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        
        .job-company {
            font-size: 0.9rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }
        
        .job-type {
            background: rgba(232, 255, 71, 0.1);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .job-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .job-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .job-detail-icon {
            width: 16px;
            height: 16px;
            opacity: 0.6;
        }
        
        .job-salary {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        
        .job-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .job-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .job-posted {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .apply-btn {
            background: var(--accent);
            color: var(--primary-bg);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .apply-btn:hover {
            background: var(--accent-hover);
            transform: translateX(4px);
        }
        
        footer {
            background: var(--secondary-bg);
            padding: 3rem 0;
            text-align: center;
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }
        
        .footer-content {
            color: var(--text-secondary);
        }
        
        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .job-card {
            animation: fadeInUp 0.6s ease forwards;
        }
        
        .job-card:nth-child(1) { animation-delay: 0.1s; }
        .job-card:nth-child(2) { animation-delay: 0.2s; }
        .job-card:nth-child(3) { animation-delay: 0.3s; }
        .job-card:nth-child(4) { animation-delay: 0.4s; }
        .job-card:nth-child(5) { animation-delay: 0.5s; }
        .job-card:nth-child(6) { animation-delay: 0.6s; }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            .jobs-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                gap: 2rem;
            }
            
            .filters-grid {
                grid-template-columns: 1fr;
            }
            
            .section-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
</head>

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) return '1 day ago';
            if (diffDays < 7) return `${diffDays} days ago`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
            return `${Math.floor(diffDays / 30)} months ago`;
        }

        function getWorkModeIcon(workMode) {
            switch(workMode) {
                case 'remote': return '🌐';
                case 'hybrid': return '🏢';
                case 'office': return '🏢';
                default: return '📍';
            }
        }

        function getContractTypeIcon(contractType) {
            switch(contractType) {
                case 'full_time': return '⏰';
                case 'part_time': return '⏳';
                case 'contract': return '📋';
                default: return '💼';
            }
        }

        function renderJobs(jobs) {
            const jobsGrid = document.getElementById('jobs-grid');
            
            jobsGrid.innerHTML = jobs.map(job => `
                <div class="job-card" onclick="openJob('${job.id}')">
                    <div class="job-header">
                        <div>
                            <h3 class="job-title">${job.jobRole}</h3>
                            <div class="job-company">${job.company}</div>
                        </div>
                        <div class="job-type">${job.contractType.replace('_', ' ')}</div>
                    </div>
                    
                    <div class="job-details">
                        <div class="job-detail">
                            <span class="job-detail-icon">📍</span>
                            <span>${job.location.name}</span>
                        </div>
                        <div class="job-detail">
                            <span class="job-detail-icon">${getWorkModeIcon(job.workMode)}</span>
                            <span>${job.workMode}</span>
                        </div>
                        <div class="job-detail">
                            <span class="job-detail-icon">📊</span>
                            <span>${job.seniority}</span>
                        </div>
                        <div class="job-detail">
                            <span class="job-detail-icon">🏷️</span>
                            <span>${job.func}</span>
                        </div>
                    </div>
                    
                    <div class="job-salary">${job.salary}</div>
                    
                    <p class="job-summary">${job.summary}</p>
                    
                    <div class="job-footer">
                        <span class="job-posted">${formatDate(job.createdAt)}</span>
                        <a href="#" class="apply-btn" onclick="event.stopPropagation(); openJob('${job.id}')">
                            Apply
                            <span>→</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function openJob(jobId) {
            // In production, this would open the Atlas-hosted job page
            // For now, show an alert with the intended behavior
            alert(`This would open the Atlas job page for job ID: ${jobId}\n\nURL format: https://atlas.recruitwithatlas.com/jobs/${jobId}`);
        }

        function setupFilters() {
            const filters = ['location', 'function', 'seniority', 'work-mode'];
            
            filters.forEach(filterId => {
                document.getElementById(filterId).addEventListener('change', applyFilters);
            });
        }

        function applyFilters() {
            const location = document.getElementById('location').value;
            const func = document.getElementById('function').value;
            const seniority = document.getElementById('seniority').value;
            const workMode = document.getElementById('work-mode').value;

            let filteredJobs = mockJobs.filter(job => {
                return (!location || job.location.name.toLowerCase().includes(location)) &&
                       (!func || job.func.toLowerCase() === func) &&
                       (!seniority || job.seniority === seniority) &&
                       (!workMode || job.workMode === workMode);
            });

            document.querySelector('.jobs-count').textContent = `${filteredJobs.length} Open Roles`;
            renderJobs(filteredJobs);
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            renderJobs(mockJobs);
            setupFilters();
        });
    </script>
