name: Sync Jobs from Atlas

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [main]
    paths: [sync-jobs.js] # Re-sync if sync script changes

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need write access to commit updated jobs.json
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Sync jobs from Atlas
        env:
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
        run: npm run sync
      
      - name: Commit updated jobs data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are changes
          if git diff --quiet public/jobs.json; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add public/jobs.json sync-log.json
          git commit -m "Update jobs data - $(date -u +"%Y-%m-%d %H:%M UTC")"
          git push
      
      - name: Deploy to Vercel (if changed)
        # Vercel will automatically redeploy when we push the updated JSON
        run: echo "Jobs updated, Vercel will auto-deploy"

