name: Sync Jobs from Atlas

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:          # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run sync script
        env:
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
        run: node sync-jobs.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet public/jobs.json; then
            echo "No changes to commit"
          else
            git add public/jobs.json
            git commit -m "chore: update jobs data - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Changes committed and pushed"
          fi
