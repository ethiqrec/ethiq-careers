name: Sync Jobs from Atlas

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sync-jobs.js]

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install --production
      
      - name: Sync jobs from Atlas
        env:
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
        run: npm run sync
      
      - name: Commit updated jobs data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet public/jobs.json; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add public/jobs.json
          git commit -m "Update jobs data - $(date -u +"%Y-%m-%d %H:%M UTC")"
          git push
